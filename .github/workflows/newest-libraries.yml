name: Newest libraries

# CI pins Claude Code (the npm install line in ci.yml). This weekly run uses the newest
# release instead, so a release that breaks the packs shows up before the pin moves.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  packs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@latest
      - name: Validate and test every pack
        shell: bash
        run: |
          claude --version
          failed=0
          for pack in packs/*/; do
            echo "::group::$pack"
            claude plugin validate "$pack" || failed=1
            claude plugin test "$pack" || failed=1
            echo "::endgroup::"
          done
          exit $failed
